<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00ff88"><title>Flappy Challenge | GAMEVERSE PH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090914;color:#fff;font:16px Arial,sans-serif;min-height:100vh;padding:20px}
header,.wrap{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
a,.btn{background:#00ef88;color:#06130c;border:0;border-radius:9px;padding:10px 15px;font-weight:800;text-decoration:none;cursor:pointer}
h1{color:#00ef88;margin:8px 0}.panel{background:#17172a;border:1px solid #30304a;border-radius:16px;padding:20px;margin:14px 0;text-align:center}
button{font:inherit}.muted{color:#aaa}.score{font-size:20px;color:#00ef88;font-weight:800;margin:12px}
.grid{display:grid;gap:8px;justify-content:center;margin:16px auto}.cell{background:#292943;border:1px solid #454566;border-radius:8px;display:grid;place-items:center;min-width:48px;min-height:48px;font-size:22px;font-weight:800;color:white;cursor:pointer}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyCeMwYBG6AVch8CXr-Y4ngcp9cmWtqsruU",authDomain:"gameverse-102213.firebaseapp.com",databaseURL:"https://gameverse-102213-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"gameverse-102213",storageBucket:"gameverse-102213.firebasestorage.app",messagingSenderId:"87748222074",appId:"1:87748222074:web:ef7757ff1df09e84006fc3",measurementId:"G-548P0BBQM4"};

</head><body><header><b style="color:#00ef88;font-size:22px">GAMEVERSE PH</b><a href="../index.html">← Game Lobby</a></header><main class="wrap"><section class="panel"><h1>Flappy Challenge</h1><p class="muted">Play for fun • Earn practice points</p><canvas id="game" width="320" height="420" style="max-width:100%;background:linear-gradient(#13294b,#101020);border:2px solid #00ef88;border-radius:10px"></canvas><div class="score">Score: <span id="score">0</span></div><button class="btn" onclick="start()">Start / Flap</button><p class="muted">Tap or press Space to fly between the pipes.</p><p>Practice points: <b id="points">0</b></p></section></main><script>
function award(points){let total=Number(localStorage.getItem('gv_points')||0)+points;localStorage.setItem('gv_points',total);let el=document.getElementById('points');if(el)el.textContent=total;}document.getElementById('points').textContent=Number(localStorage.getItem('gv_points')||0);
let c=document.getElementById('game'),ctx=c.getContext('2d'),bird,pipes,score,alive,timer,rewardClaimed=localStorage.getItem('gv_flappy_reward_claimed')==='1';function start(){clearInterval(timer);bird=180;pipes=[{x:340,gap:145,passed:false}];score=0;alive=true;document.getElementById('score').textContent=0;timer=setInterval(tick,30);draw()}function flap(){if(!alive){start();return}bird-=32}function tick(){bird+=3;pipes.forEach(p=>{p.x-=3;if(p.x===160)pipes.push({x:340,gap:100+Math.random()*180,passed:false});if(!p.passed&&p.x<55){p.passed=true;score++;document.getElementById('score').textContent=score}});pipes=pipes.filter(p=>p.x>-60);let p=pipes.find(p=>p.x<75&&p.x>5);if(bird<0||bird>420||(p&&(bird<p.gap-65||bird>p.gap+65))){alive=false;clearInterval(timer);if(score>=5&&!rewardClaimed){rewardClaimed=true;localStorage.setItem('gv_flappy_reward_claimed','1');award(5)}}draw()}function draw(){ctx.clearRect(0,0,320,420);ctx.fillStyle='#00ef88';pipes.forEach(p=>{ctx.fillRect(p.x,0,48,p.gap-65);ctx.fillRect(p.x,p.gap+65,48,420)});ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(75,bird,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.fillText(alive?'Tap to flap':'Game over — press Start',80,22)}c.addEventListener('click',flap);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});start();
</script></body></html>
