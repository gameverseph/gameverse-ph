</head><body><header><b style="color:#00ef88;font-size:22px">GAMEVERSE PH</b><a href="../index.html">← Game Lobby</a></header><main class="wrap"><section class="panel"><h1>Rock Paper Scissors</h1><p class="muted">Play for fun • Earn practice points</p><p class="muted">Choose your move. First to 5 wins!</p><div class="score" id="score">You 0 — 0 CPU</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="play('rock')">✊ Rock</button><button class="btn" onclick="play('paper')">✋ Paper</button><button class="btn" onclick="play('scissors')">✌️ Scissors</button></div><h2 id="result" style="margin:20px"></h2><button class="btn" onclick="reset()">Reset</button><p>Practice points: <b id="points">0</b></p></section></main><script>
