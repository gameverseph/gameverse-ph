</head><body><header><b style="color:#00ef88;font-size:22px">GAMEVERSE PH</b><a href="../index.html">← Game Lobby</a></header><main class="wrap"><section class="panel"><h1>Snake</h1><p class="muted">Play for fun • Earn practice points</p><div class="score">Score: <span id="score">0</span></div><p class="muted" id="message" role="status">Press Start to play.</p><canvas id="game" width="320" height="320" style="max-width:100%;background:#08080e;border:2px solid #00ef88;border-radius:10px"></canvas><p><button class="btn" onclick="start()">Start / Restart</button></p><p class="muted">Use arrow keys or swipe on the board.</p><p>Practice points: <b id="points">0</b></p></section></main><script>
function award(points){let total=Number(localStorage.getItem('gv_points')||0)+points;localStorage.setItem('gv_points',total);let el=document.getElementById('points');if(el)el.textContent=total;}
const c=document.getElementById('game'),x=c.getContext('2d');let s,dir,food,score,timer,run=false,awarded=false;function start(){clearInterval(timer);s=[{x:8,y:8}];dir={x:1,y:0};food={x:3,y:4};score=0;run=true;awarded=false;document.getElementById('score').textContent=0;document.getElementById('message').textContent='Game on! Avoid the walls and your tail.';timer=setInterval(tick,120);draw()}function tick(){let h={x:s[0].x+dir.x,y:s[0].y+dir.y};if(h.x<0||h.y<0||h.x>=16||h.y>=16||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);run=false;const earned=score*2;if(!awarded&&earned>0){award(earned);awarded=true}document.getElementById('message').textContent='Game over! Score: '+score+'. Practice points earned: '+earned+'. Press Start / Restart to play again.';return} s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;do{food={x:Math.floor(Math.random()*16),y:Math.floor(Math.random()*16)}}while(s.some(p=>p.x===food.x&&p.y===food.y));}else s.pop();draw()}function draw(){x.fillStyle='#08080e';x.fillRect(0,0,320,320);x.fillStyle='#00ef88';s.forEach(p=>x.fillRect(p.x*20+1,p.y*20+1,18,18));x.fillStyle='#ffce45';x.fillRect(food.x*20+2,food.y*20+2,16,16)}document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&!(d[0]===-dir.x&&d[1]===-dir.y)){dir={x:d[0],y:d[1]}}});let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))dir={x:Math.sign(dx),y:0};else dir={x:0,y:Math.sign(dy)}},{passive:true});document.getElementById('points').textContent=Number(localStorage.getItem('gv_points')||0);start();
</script></body></html>
