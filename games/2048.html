<style>
*{box-sizing:border-box}body{margin:0;background:#090914;color:#fff;font:16px Arial,sans-serif;min-height:100vh;padding:20px}

</head><body><header><b style="color:#00ef88;font-size:22px">GAMEVERSE PH</b><a href="../index.html">← Game Lobby</a></header><main class="wrap"><section class="panel"><h1>2048</h1><p class="muted">Play for fun • Earn practice points</p><div class="score">Score: <span id="score">0</span></div><div id="board" class="grid" style="grid-template-columns:repeat(4,64px)"></div><p class="muted">Use arrow keys or swipe to combine matching tiles.</p><button class="btn" onclick="init()">Restart</button><p>Practice points: <b id="points">0</b></p></section></main><script>
function award(points){let total=Number(localStorage.getItem('gv_points')||0)+points;localStorage.setItem('gv_points',total);let el=document.getElementById('points');if(el)el.textContent=total;}
let a,score=0,rewardClaimed=localStorage.getItem('gv_2048_reward_claimed')==='1';document.getElementById('points').textContent=Number(localStorage.getItem('gv_points')||0);function init(){a=Array(16).fill(0);score=0;spawn();spawn();render()}function spawn(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function render(){document.getElementById('score').textContent=score;let el=document.getElementById('board');el.innerHTML='';a.forEach(v=>{let d=document.createElement('div');d.className='cell';d.style.height='64px';d.style.fontSize='20px';d.textContent=v||'';d.style.background=v?'#315b4b':'#292943';el.appendChild(d)})}function move(dir){let old=a.join(',');for(let n=0;n<4;n++){let ids=Array.from({length:4},(_,i)=>dir==='left'||dir==='right'?n*4+i:i*4+n);if(dir==='right'||dir==='down')ids.reverse();let vals=ids.map(i=>a[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){let v=vals[i]*2;out.push(v);score+=v;i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>a[id]=out[i])}if(old!==a.join(',')){spawn();render();if(a.includes(2048)&&!rewardClaimed){rewardClaimed=true;localStorage.setItem('gv_2048_reward_claimed','1');award(20);alert('2048! Achievement unlocked: +20 practice points!')}}}document.addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});let tx=0,ty=0;document.getElementById('board').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});document.getElementById('board').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});init();
</script></body></html>
