<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00ff88"><title>Memory Match | GAMEVERSE PH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090914;color:#fff;font:16px Arial,sans-serif;min-height:100vh;padding:20px}

</head><body><header><b style="color:#00ef88;font-size:22px">GAMEVERSE PH</b><a href="../index.html">← Game Lobby</a></header><main class="wrap"><section class="panel"><h1>Memory Match</h1><p class="muted">Play for fun • Earn practice points</p><div class="score" id="status">Find all matching pairs</div><div id="board" class="grid" style="grid-template-columns:repeat(4,64px)"></div><button class="btn" onclick="init()">Restart</button><p>Moves: <b id="moves">0</b> • Practice points: <b id="points">0</b></p></section></main><script>

const icons=['🍉','🚀','🐼','⭐','🎮','🍀','⚽','🔥'];let cards,first,lock,moves,matched,completed=false;function init(){cards=[...icons,...icons].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;matched=[];completed=false;document.getElementById('moves').textContent=0;render()}function render(){let el=document.getElementById('board');el.innerHTML='';cards.forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.style.height='64px';b.textContent=matched.includes(i)||first===i? v:'?';b.onclick=()=>flip(i);el.appendChild(b)})}function flip(i){if(completed||lock||matched.includes(i)||first===i)return;if(first===null){first=i;render();return}moves++;document.getElementById('moves').textContent=moves;if(cards[first]===cards[i]){matched.push(first,i);first=null;if(matched.length===16&&!completed){completed=true;document.getElementById('status').textContent='You matched them all! +10 practice points';award(10)}}else{let prev=first;first=i;lock=true;render();setTimeout(()=>{first=null;lock=false;render()},700);return}render()}document.getElementById('points').textContent=Number(localStorage.getItem('gv_points')||0);init();
